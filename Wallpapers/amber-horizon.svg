<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>Amber Horizon</title>
  <desc>An original abstract landscape of flowing navy and teal hills beneath an amber glow. Copyright 2026 senqx. MIT licensed; see ../LICENSE.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="0.55" stop-color="#18303b"/>
      <stop offset="1" stop-color="#34545b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.31" cy="0.49" r="0.62" gradientTransform="translate(0 0.16) scale(1 0.7)">
      <stop offset="0" stop-color="#ffd397" stop-opacity="0.84"/>
      <stop offset="0.2" stop-color="#d99558" stop-opacity="0.64"/>
      <stop offset="0.46" stop-color="#b87548" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#b87548" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6f8075"/>
      <stop offset="1" stop-color="#365b63"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#284c59"/>
      <stop offset="1" stop-color="#193643"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#162e3c"/>
      <stop offset="1" stop-color="#0e1f2d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#101e2d"/>
      <stop offset="1" stop-color="#090e18"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.48" cy="0.48" r="0.75">
      <stop offset="0.35" stop-color="#070c14" stop-opacity="0"/>
      <stop offset="1" stop-color="#070c14" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <!-- Broad, continuous curves keep the scene quiet behind desktop windows. -->
  <path d="M0 1410 C350 1280 650 1140 1030 1210 S1610 1370 1990 1180 S2610 880 3020 1020 S3540 1170 3840 1050 V2160 H0Z" fill="url(#far)"/>
  <path d="M0 1500 C470 1560 690 1380 1070 1340 S1660 1510 2080 1460 S2730 1150 3120 1220 S3560 1470 3840 1390 V2160 H0Z" fill="url(#middle)"/>
  <path d="M0 1790 C480 1560 890 1650 1260 1700 S1850 1740 2290 1560 S2890 1430 3280 1610 S3600 1720 3840 1650 V2160 H0Z" fill="url(#near)"/>
  <!-- Thin contour accents are original graphic elements, not traced artwork. -->
  <g fill="none" stroke="#8faaa4" stroke-width="2" opacity="0.13">
    <path d="M2310 1320 C2580 1160 2820 1110 3080 1170 S3510 1390 3840 1320"/>
    <path d="M2240 1360 C2570 1210 2800 1170 3090 1230 S3510 1440 3840 1380"/>
    <path d="M0 1740 C380 1560 720 1590 1040 1650"/>
  </g>
  <path d="M0 1910 C400 1790 680 1810 1060 1900 S1650 2000 2060 1880 S2720 1720 3160 1850 S3580 2020 3840 1900 V2160 H0Z" fill="url(#front)"/>
  <rect width="3840" height="2160" fill="url(#shade)"/>
</svg>
